    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root { --pink: #e84b74; --dark: #2c2825; --bg: #f4f5f6; }
    html, body { scroll-snap-type: none; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; color: var(--dark); background: var(--bg); overflow: hidden; }
    .track { position: fixed; inset: 0 auto auto 0; display: flex; height: 100vh; will-change: transform; }
    .slide { width: 100vw; height: 100vh; flex: 0 0 100vw; display: grid; place-items: center; padding: 0; }
    .slide-frame { width: 100vw; height: 100vh; overflow: hidden; opacity: 0; transition: opacity 0.8s ease; }
    .slide.is-visible .slide-frame { opacity: 1; }
    .slide img { display: block; width: 100%; height: 100%; object-fit: cover; }
    nav { position: fixed; top: 0; left: 0; right: 0; display: flex; align-items: center; justify-content: space-between; padding: 1.5rem 4rem; z-index: 100; mix-blend-mode: multiply; }
    .back-link, .site-name { color: var(--dark); text-decoration: none; text-transform: uppercase; }
    .back-link { display: flex; align-items: center; gap: 0.5rem; font-size: 0.75rem; letter-spacing: 0.15em; transition: gap 0.2s ease; }
    .back-link:hover { gap: 0.8rem; }
    .site-name { position: absolute; left: 50%; transform: translateX(-50%); font-size: 0.8rem; letter-spacing: 0.12em; opacity: 0.4; }
    .slide-counter { position: fixed; right: 2.5rem; bottom: 2rem; z-index: 100; color: rgba(44, 40, 37, 0.58); font-size: 0.75rem; letter-spacing: 0.2em; }
    .hamburger { position: fixed; top: 1.5rem; right: 1.5rem; z-index: 301; display: flex; flex-direction: column; gap: 5px; padding: 4px; border: 0; background: none; cursor: pointer; }
    .hamburger span { width: 22px; height: 2px; background: var(--dark); transition: all 0.3s ease; }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; transform: scaleX(0); }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }
    .menu-overlay { position: fixed; inset: 0; z-index: 300; display: flex; align-items: center; justify-content: center; background: var(--bg); opacity: 0; pointer-events: none; transition: opacity 0.3s ease; }
    .menu-overlay.open { opacity: 1; pointer-events: auto; }
    .menu-links { display: flex; flex-direction: column; align-items: flex-end; gap: 2rem; padding-right: 3.5rem; }
    .menu-links a { display: flex; align-items: baseline; gap: 0.75rem; color: var(--dark); font-size: clamp(1.4rem, 6vw, 2rem); font-weight: 700; letter-spacing: -0.02em; text-decoration: none; transition: color 0.2s ease; }
    .menu-links a:hover { color: var(--pink); }
    .menu-links a span { color: var(--pink); font-size: 0.65rem; font-weight: 400; letter-spacing: 0.15em; }
    @media (max-width: 768px) {
      html, body { scroll-behavior: auto; scroll-snap-type: none; }
      body { overflow-x: hidden; overflow-y: auto; }
      nav { padding: 1.1rem 1.25rem; background: rgba(244, 245, 246, 0.9); backdrop-filter: blur(10px); mix-blend-mode: normal; }
      .hamburger { top: 1.1rem; right: 1.25rem; }
      .track { position: relative; display: block; height: auto; padding: 4.25rem 0 0.5rem; transform: none !important; }
      .slide { width: 100%; height: auto; min-height: 0; padding: 0; background: #000; scroll-snap-align: none; scroll-snap-stop: normal; }
      .slide + .slide { margin-top: 0.5rem; }
      .slide-frame { width: 100%; height: auto; aspect-ratio: 16 / 9; }
      .slide img { object-fit: contain; }
      .slide-counter { display: none; }
      .menu-links { gap: 1.35rem; padding-right: 1.5rem; }
    }
    @media (prefers-reduced-motion: reduce) { .slide-frame { transition: none; } }
  </style>

  <p class="slide-counter" id="slideCounter">01 / 22</p>
  <script>
    const track = document.getElementById('track');
    const slides = [...document.querySelectorAll('.slide')];
    const counter = document.getElementById('slideCounter');
    const hamburger = document.getElementById('hamburger');
    const menuOverlay = document.getElementById('menuOverlay');
    const mobile = () => window.innerWidth <= 768;
    const pad = value => String(value).padStart(2, '0');
    let current = 0;
    let target = 0;
    let animationFrame = null;
    let lastActiveSlide = -1;
    let lastFrameTime = null;
    const maxX = () => (slides.length - 1) * window.innerWidth;
    function warmSlides(startIndex) {
      slides.slice(startIndex, startIndex + 4).forEach(slide => {
        const image = slide.querySelector('img');
        image.loading = 'eager';
        image.decoding = 'async';
        if (image.decode) image.decode().catch(() => {});
      });
    }
    function updateSlides() {
      const activeSlide = Math.round(current / window.innerWidth);
      if (activeSlide === lastActiveSlide) return;
      lastActiveSlide = activeSlide;
      slides.forEach((slide, index) => slide.classList.toggle('is-visible', Math.abs(index - activeSlide) <= 1));
      counter.textContent = `${pad(activeSlide + 1)} / ${pad(slides.length)}`;
      warmSlides(activeSlide);
    }
    function animate(time) {
      if (lastFrameTime === null) lastFrameTime = time;
      const dt = Math.min(48, time - lastFrameTime);
      lastFrameTime = time;
      // Frame-rate independent easing: converges at the same real-world speed
      // whether the display refreshes at 60Hz or 120Hz+, so it glides instead
      // of snapping to place on high-refresh screens.
      const ease = 1 - Math.pow(1 - 0.14, dt / (1000 / 60));
      current += (target - current) * ease;
      if (Math.abs(target - current) < 0.4) {
        current = target;
        animationFrame = null;
        lastFrameTime = null;
      } else {
        animationFrame = requestAnimationFrame(animate);
      }
      track.style.transform = `translateX(-${current}px)`;
      updateSlides();
    }
    window.addEventListener('wheel', event => {
      if (mobile() || menuOverlay.classList.contains('open')) return;
      event.preventDefault();
      const delta = Math.abs(event.deltaX) > Math.abs(event.deltaY) ? event.deltaX : event.deltaY;
      target = Math.max(0, Math.min(maxX(), target + delta));
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
    }, { passive: false });
    window.addEventListener('resize', () => {
      if (mobile()) return;
      target = Math.min(target, maxX());
      current = Math.min(current, maxX());
      track.style.transform = `translateX(-${current}px)`;
      updateSlides();
    });
    document.addEventListener('keydown', event => {
      if (mobile()) return;
      const forward = event.key === 'ArrowRight' || event.key === 'ArrowDown';
      const backward = event.key === 'ArrowLeft' || event.key === 'ArrowUp';
      if (!forward && !backward) return;
      target = forward
        ? Math.min(maxX(), target + window.innerWidth)
        : Math.max(0, target - window.innerWidth);
      if (!animationFrame) animationFrame = requestAnimationFrame(animate);
    });
    updateSlides();
    if ('IntersectionObserver' in window) {
      const observer = new IntersectionObserver(entries => entries.forEach(entry => { if (entry.isIntersecting) entry.target.classList.add('is-visible'); }), { threshold: 0.2 });
      slides.forEach(slide => observer.observe(slide));
    }
    hamburger.addEventListener('click', () => {
      const isOpen = menuOverlay.classList.toggle('open');
      hamburger.classList.toggle('open', isOpen);
      hamburger.setAttribute('aria-expanded', String(isOpen));
    });
    document.addEventListener('keydown', event => {
      if (event.key === 'Escape') {
        menuOverlay.classList.remove('open');
        hamburger.classList.remove('open');
        hamburger.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
