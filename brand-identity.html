<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Brand Identity — Lori Tsou</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root { --pink: #e84b74; --dark: #2c2825; --bg: #f4f5f6; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      color: var(--dark);
      background: var(--bg);
      overflow-x: hidden;
    }

    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 1.5rem 4rem;
      z-index: 100;
      mix-blend-mode: multiply;
    }

    .back-link {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--dark);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 0.5rem;
      transition: gap 0.2s;
    }
    .back-link:hover { gap: 0.8rem; }

    .site-name {
      font-size: 0.8rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      opacity: 0.4;
      text-decoration: none;
      color: var(--dark);
      position: absolute;
      left: 50%;
      transform: translateX(-50%);
    }

    /* ── Hamburger ── */
    .hamburger {
      display: flex;
      position: fixed;
      top: 1.4rem;
      right: 1.5rem;
      z-index: 400;
      flex-direction: column;
      gap: 5px;
      background: none;
      border: none;
      cursor: pointer;
      padding: 4px;
    }
    .hamburger span {
      display: block;
      width: 22px;
      height: 2px;
      background: var(--dark);
      border-radius: 2px;
      transition: transform 0.3s ease, opacity 0.3s ease;
    }
    .hamburger.open span:nth-child(1) { transform: translateY(7px) rotate(45deg); }
    .hamburger.open span:nth-child(2) { opacity: 0; }
    .hamburger.open span:nth-child(3) { transform: translateY(-7px) rotate(-45deg); }

    .menu-overlay {
      position: fixed;
      inset: 0;
      background: #f4f5f6;
      z-index: 300;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }
    .menu-overlay.open {
      opacity: 1;
      pointer-events: auto;
    }
    .menu-links {
      padding-right: 3.5rem;
      display: flex;
      flex-direction: column;
      align-items: flex-end;
      gap: 2rem;
    }
    .menu-links a {
      font-size: clamp(1.4rem, 6vw, 2rem);
      font-weight: 700;
      text-decoration: none;
      color: var(--dark);
      letter-spacing: -0.02em;
      display: flex;
      align-items: baseline;
      gap: 0.75rem;
      transition: color 0.2s;
    }
    .menu-links a:hover { color: var(--pink); }
    .menu-links a span {
      font-size: 0.65rem;
      letter-spacing: 0.15em;
      font-weight: 400;
      color: var(--pink);
    }

    /* ── Hero ── */
    .bi-hero {
      padding: 14rem 4rem 4rem;
      max-width: 900px;
    }

    .bi-label {
      font-size: 0.7rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      color: var(--pink);
      margin-bottom: 1rem;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.2s forwards;
    }

    .bi-hero h1 {
      font-size: clamp(2.8rem, 5vw, 5.5rem);
      font-weight: 700;
      line-height: 0.95;
      letter-spacing: -0.03em;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.4s forwards;
    }
    .bi-hero h1 span { color: var(--pink); }

    .bi-hero p {
      font-size: 1rem;
      line-height: 1.7;
      opacity: 0.65;
      margin-top: 1.5rem;
      max-width: 520px;
      opacity: 0;
      animation: fadeUp 0.8s ease 0.6s forwards;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(24px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Image stack ── */
    .bi-pages {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
      padding: 4rem 0 8rem;
    }

    .bi-pages img {
      width: 100%;
      max-width: 960px;
      display: block;
    }

    @media (max-width: 768px) {
      nav { padding: 1.5rem 1.5rem; }
      .bi-hero { padding: 10rem 1.5rem 3rem; }
      .bi-pages { padding: 2rem 0 5rem; }
      .bi-pages img { max-width: 100%; }
    }
  </style>
</head>
<body>

      hamburger.classList.toggle('open');
      menuOverlay.classList.toggle('open');
    });
